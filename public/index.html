<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ITE183 Lab 2 Chat</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 48px auto; padding: 0 18px; color: #202734; }
    h1 { font-size: 1.5rem; margin-bottom: 4px; }
    p { color: #566173; }
    #status { padding: 10px 12px; background: #eef2f6; border-radius: 6px; }
    #status.connected { background: #e0f3e7; color: #155c35; }
    #status.disconnected { background: #fce8e8; color: #8c2525; }
    #messages { min-height: 230px; max-height: 320px; overflow-y: auto; border: 1px solid #c8d0da; border-radius: 6px; padding: 12px; margin: 16px 0; list-style: none; }
    #messages li { margin-bottom: 8px; overflow-wrap: anywhere; }
    form { display: flex; gap: 8px; }
    input { flex: 1; min-width: 0; padding: 10px; }
    button { padding: 10px 18px; cursor: pointer; }
    button:disabled { cursor: default; }
  </style>
</head>
<body>
  <main>
    <h1>ITE183 WebSocket Chat</h1>
    <p>Open this page in two tabs to see messages broadcast to both clients.</p>
    <div id="status" role="status">Connecting...</div>
    <ul id="messages" aria-label="Chat messages" aria-live="polite"></ul>
    <form id="chat-form">
      <input id="message" type="text" aria-label="Message" placeholder="Type a message" autocomplete="off" disabled>
      <button id="send" type="submit" disabled>Send</button>
    </form>
  </main>
  <script>
    const scheme = location.protocol === "https:" ? "wss:" : "ws:";
    const socket = new WebSocket(`${scheme}//${location.host}/`);
    const status = document.getElementById("status");
    const messages = document.getElementById("messages");
    const input = document.getElementById("message");
    const send = document.getElementById("send");

    function addMessage(text) {
      const item = document.createElement("li");
      item.textContent = text;
      messages.appendChild(item);
      messages.scrollTop = messages.scrollHeight;
    }

    socket.onopen = function () {
      status.textContent = "Connected";
      status.className = "connected";
      input.disabled = false;
      send.disabled = false;
      input.focus();
    };

    socket.onmessage = function (event) {
      addMessage(event.data);
    };

    socket.onclose = function () {
      status.textContent = "Disconnected. Refresh to reconnect.";
      status.className = "disconnected";
      input.disabled = true;
      send.disabled = true;
    };

    socket.onerror = function () {
      addMessage("WebSocket connection error.");
    };

    document.getElementById("chat-form").addEventListener("submit", function (event) {
      event.preventDefault();
      const message = input.value.trim();
      if (message && socket.readyState === WebSocket.OPEN) {
        socket.send(message);
        input.value = "";
      }
    });
  </script>
</body>
</html>
